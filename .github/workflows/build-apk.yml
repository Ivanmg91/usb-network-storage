name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      # If gradlew doesn't exist (because we didn't use Android Studio to generate it), this step might fail.
      # But we can bypass this by calling gradle directly or generating the wrapper if missing.
      continue-on-error: true

    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.7
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: USBLocal-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
